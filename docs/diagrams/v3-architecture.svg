<text x="70" y="229" fill="#2366C4" font-size="17" font-weight="700">01</text>
<text x="70" y="272" fill="#15283F" font-size="22" font-weight="650">选题与素材</text>
<text x="70" y="305" fill="#607187" font-size="14" font-weight="400">明确问题 · 核验证据</text>

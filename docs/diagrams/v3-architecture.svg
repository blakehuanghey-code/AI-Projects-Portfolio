<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect x="0" y="0" width="1320" height="740" rx="0" fill="#F5F8FC" stroke="none"/>
<rect x="52" y="42" width="56" height="36" rx="9" fill="#2366C4" stroke="none"/>
<text x="64" y="68" fill="#FFFFFF" font-size="22" font-weight="700">V3</text>
<text x="126" y="73" fill="#15283F" font-size="34" font-weight="700">AI 内容工作流</text>
<text x="54" y="115" fill="#607187" font-size="20" font-weight="400">从素材到发布，每一步都有明确交接和人工确认。</text>
<text x="54" y="170" fill="#607187" font-size="17" font-weight="600">业务主线</text>

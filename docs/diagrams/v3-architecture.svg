<text x="54" y="425" fill="#607187" font-size="15" font-weight="400">上方小标记说明本包收录内容；可运行的是固定模拟回放，人工确认字段均为模拟预设。</text>
<text x="54" y="480" fill="#607187" font-size="17" font-weight="600">系统支撑</text>
<rect x="54" y="500" width="392" height="146" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="76" y="538" fill="#15283F" font-size="23" font-weight="650">Skill 工作说明</text>
<text x="76" y="569" fill="#607187" font-size="16" font-weight="400">安排写作、审稿和平台交接</text>
<rect x="76" y="606" width="100" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="87" y="626" fill="#607187" font-size="13" font-weight="500">两份精简说明</text>
<rect x="464" y="500" width="392" height="146" rx="14" fill="#EBF3FF" stroke="#D9E2EE"/>
<text x="486" y="538" fill="#15283F" font-size="23" font-weight="650">Python 阶段检查</text>
<text x="486" y="569" fill="#607187" font-size="16" font-weight="400">素材 → 初稿 → 终稿 → 文字组合</text>
<rect x="486" y="606" width="113" height="28" rx="7" fill="#E9F1FF" stroke="none"/><text x="497" y="626" fill="#2366C4" font-size="13" font-weight="500">四处检查可运行</text>
<rect x="874" y="500" width="392" height="146" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="896" y="538" fill="#15283F" font-size="23" font-weight="650">人工确认</text>
<text x="896" y="569" fill="#607187" font-size="16" font-weight="400">判断内容质量、验收整包、授权发布</text>
<rect x="896" y="606" width="139" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="907" y="626" fill="#607187" font-size="13" font-weight="500">脚本不代替人工判断</text>
<text x="54" y="694" fill="#607187" font-size="16" font-weight="400">按需制作公众号长文、贴图＋问一问或小红书内容；本包提供固定模拟正文与配图，未执行真实平台发布。</text>
</g></svg>

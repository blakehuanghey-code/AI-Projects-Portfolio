<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" role="img"><title>V2 内容市场研究：业务主线、按需研究与独立入口</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#8396AF"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect x="0" y="0" width="1320" height="830" rx="0" fill="#F5F8FC" stroke="none"/>
<rect x="52" y="42" width="56" height="36" rx="9" fill="#2366C4" stroke="none"/>
<text x="64" y="68" fill="#FFFFFF" font-size="22" font-weight="700">V2</text>
<text x="126" y="73" fill="#15283F" font-size="34" font-weight="700">内容市场研究</text>
<text x="54" y="115" fill="#607187" font-size="20" font-weight="400">研究市场、对标账号与读者需求，为选题和内容安排提供依据。</text>
<text x="54" y="170" fill="#607187" font-size="17" font-weight="600">市场研究主线</text>
<rect x="54" y="192" width="224" height="174" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="74" y="227" fill="#2366C4" font-size="17" font-weight="700">01</text>
<text x="74" y="268" fill="#15283F" font-size="23" font-weight="650">确定研究范围</text>
<text x="74" y="302" fill="#607187" font-size="16" font-weight="400">方向·关键词·平台</text>
<rect x="70" y="324" width="113" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="81" y="344" fill="#607187" font-size="13" font-weight="500">任务配置未收录</text>
<path d="M283 268 H295" stroke="#8396AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="298" y="192" width="224" height="174" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="318" y="227" fill="#2366C4" font-size="17" font-weight="700">02</text>
<text x="318" y="268" fill="#15283F" font-size="23" font-weight="650">采集与补全</text>
<text x="318" y="302" fill="#607187" font-size="16" font-weight="400">搜索·详情·账号信息</text>
<rect x="314" y="324" width="178" height="28" rx="7" fill="#E9F1FF" stroke="none"/><text x="325" y="344" fill="#2366C4" font-size="13" font-weight="500">预算检查可运行／请求片段</text>
<path d="M527 268 H539" stroke="#8396AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="542" y="192" width="224" height="174" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="562" y="227" fill="#2366C4" font-size="17" font-weight="700">03</text>
<text x="562" y="268" fill="#15283F" font-size="23" font-weight="650">整理市场样本</text>
<text x="562" y="302" fill="#607187" font-size="16" font-weight="400">字段整理·去重·分类</text>
<rect x="558" y="324" width="178" height="28" rx="7" fill="#E9F1FF" stroke="none"/><text x="569" y="344" fill="#2366C4" font-size="13" font-weight="500">整理可运行 · 存取片段</text>
<path d="M771 268 H783" stroke="#8396AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="786" y="192" width="224" height="174" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="806" y="227" fill="#2366C4" font-size="17" font-weight="700">04</text>
<text x="806" y="268" fill="#15283F" font-size="23" font-weight="650">分类与机会分析</text>
<text x="806" y="302" fill="#607187" font-size="16" font-weight="400">表现比较·机会·标杆</text>
<rect x="802" y="324" width="152" height="28" rx="7" fill="#E9F1FF" stroke="none"/><text x="813" y="344" fill="#2366C4" font-size="13" font-weight="500">校验与基础统计可运行</text>
<path d="M1015 268 H1027" stroke="#8396AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1030" y="192" width="224" height="174" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="1050" y="227" fill="#2366C4" font-size="17" font-weight="700">05</text>
<text x="1050" y="268" fill="#15283F" font-size="23" font-weight="650">形成阶段报告</text>
<text x="1050" y="302" fill="#607187" font-size="16" font-weight="400">证据·结论·待验证项</text>
<rect x="1046" y="324" width="61" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="1057" y="344" fill="#607187" font-size="13" font-weight="500">未收录</text>
<text x="54" y="407" fill="#607187" font-size="17" font-weight="600">按需研究与内容安排</text>
<text x="255" y="407" fill="#607187" font-size="15" font-weight="400">与主线配合，不是必须逐一完成的后续步骤</text>
<rect x="54" y="430" width="392" height="158" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="76" y="468" fill="#15283F" font-size="23" font-weight="650">评论分析</text>
<text x="76" y="500" fill="#607187" font-size="16" font-weight="400">选市场样本 → 采集评论 → 识别需求</text>
<rect x="76" y="546" width="61" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="87" y="566" fill="#607187" font-size="13" font-weight="500">未收录</text>
<rect x="464" y="430" width="392" height="158" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="486" y="468" fill="#15283F" font-size="23" font-weight="650">指定账号研究</text>
<text x="486" y="500" fill="#607187" font-size="16" font-weight="400">账号文章＋专项评论 → 对标分析</text>
<rect x="486" y="546" width="61" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="497" y="566" fill="#607187" font-size="13" font-weight="500">未收录</text>
<rect x="874" y="430" width="392" height="158" rx="14" fill="#FFFFFF" stroke="#D9E2EE"/>
<text x="896" y="468" fill="#15283F" font-size="23" font-weight="650">素材库 / 内容规划</text>
<text x="896" y="500" fill="#607187" font-size="16" font-weight="400">市场样本可直接选入素材库</text>
<text x="896" y="522" fill="#607187" font-size="16" font-weight="400">研究证据与内容安排按需交接 V3</text>
<rect x="896" y="546" width="61" height="28" rx="7" fill="#EEF2F6" stroke="none"/><text x="907" y="566" fill="#607187" font-size="13" font-weight="500">未收录</text>
<text x="54" y="627" fill="#607187" font-size="17" font-weight="600">独立情报入口</text>
<text x="210" y="627" fill="#15283F" font-size="17" font-weight="400">AI 热点雷达 · Codex 重置动态（均未收录）</text>
<rect x="54" y="655" width="1212" height="75" rx="12" fill="#EBF3FF" stroke="none"/>
<text x="74" y="685" fill="#2366C4" font-size="17" font-weight="600">系统支撑</text>
<text x="184" y="685" fill="#15283F" font-size="17" font-weight="400">网页工作台 · MySQL · 后台 AI 复核 · 付费账本与缓存</text>
<text x="74" y="712" fill="#607187" font-size="16" font-weight="400">后台 AI 在保存后独立复核；市场、指定账号与评论资料分域管理。</text>
<text x="54" y="766" fill="#607187" font-size="15" font-weight="400">图中标签表示展示包收录范围；“可运行”仅指本地独立逻辑，未连接真实服务。</text>
<text x="54" y="797" fill="#607187" font-size="15" font-weight="400">补充采集按需确认预算；入素材库不自动启动写作或发布。指定账号评论的网页接入仍待完成。</text>
</g></svg>